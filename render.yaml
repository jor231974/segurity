# render.yaml — Despliegue gratuito de demostración (Render)
# Referencia: https://render.com/docs/blueprint-spec
#
# Cómo usarlo (resumen, detalle en DEPLOYMENT.md):
#   1. Sube este repositorio a GitHub.
#   2. Crea una cuenta en render.com (plan gratuito, sin tarjeta).
#   3. En Render: "New > Blueprint" y elige este repo.
#   4. Configura las variables marcadas con `sync: false` en el dashboard
#      y dispara un redeploy (pasos y valores exactos en DEPLOYMENT.md).
#
# Nota: si Render no permite aprovisionar la base free desde el blueprint,
# crea "New > PostgreSQL" manualmente (free) y pega su Internal Database URL
# en la variable DATABASE_URL de servicom-api.

version: "1"

services:
  - type: web
    name: servicom-api
    runtime: node
    plan: free
    region: oregon
    buildCommand: npm ci --include=dev --no-audit --no-fund && npm run build --workspace @servicom/shared && npx prisma generate --schema apps/api/prisma/schema.prisma && npm run build --workspace @servicom/api
    startCommand: npx prisma migrate deploy --schema apps/api/prisma/schema.prisma && npm run prisma:seed --workspace @servicom/api && npm run prisma:demo --workspace @servicom/api && npm run start:prod --workspace @servicom/api
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PORT
        value: "3001"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: STORAGE_PATH
        value: /opt/render/project/src/data/storage
      - key: VIDEO_STORAGE_PATH
        value: /opt/render/project/src/data/videos
      - key: MAX_LOGIN_ATTEMPTS
        value: "5"
      - key: LOGIN_LOCKOUT_MINUTES
        value: "30"
      - key: VIDEO_EXPIRATION_HOURS
        value: "48"
      - key: VIDEO_DEFAULT_RESOLUTION
        value: "1280x720"
      - key: VIDEO_DEFAULT_FPS
        value: "15"
      - key: VIDEO_DEFAULT_BITRATE
        value: "1200"
      - key: VIDEO_DEFAULT_AUDIO
        value: "true"
      - key: VIDEO_FRAGMENT_SEC
        value: "5"
      - key: VIDEO_MAX_DURATION_SEC
        value: "0"
      - key: VIDEO_MIME_TYPE
        value: "video/webm;codecs=vp8,opus"
      - key: VIDEO_SIGNED_URL_TTL_MINUTES
        value: "60"

  - type: static
    name: servicom-web
    buildCommand: npm ci --include=dev --no-audit --no-fund && npm run build --workspace @servicom/shared && npm run build --workspace @servicom/web
    publishPath: apps/web/out
    envVars:
      - key: NEXT_PUBLIC_API_URL
        sync: false

databases:
  - name: servicom-db
    databaseName: servicom
    user: servicom
    plan: free